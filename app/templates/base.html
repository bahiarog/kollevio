<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}kollevio — Digitale Mitarbeiter für Ihr Team{% endblock %}</title>
<meta name="description" content="{% block description %}kollevio ist die Schmiede für digitale Mitarbeiter: spezialisierte KI-Agenten, die Ihr Team sofort verstärken.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" type="image/svg+xml" href="/static/img/logo-mark.svg">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <svg class="brand-mark" width="28" height="28" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="bm-g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E08A4F"/><stop offset="100%" stop-color="#B85C28"/></linearGradient></defs>
        <rect width="64" height="64" rx="16" fill="url(#bm-g)"/>
        <line x1="32" y1="13" x2="32" y2="20" stroke="#FBF8F3" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
        <circle cx="32" cy="11.5" r="3.4" fill="#FBF8F3"/>
        <circle cx="32" cy="37" r="15.5" fill="#FBF8F3"/>
        <circle cx="26.2" cy="34.5" r="2.6" fill="#2B2420"/>
        <circle cx="37.8" cy="34.5" r="2.6" fill="#2B2420"/>
        <path d="M 25.5 42 Q 32 47 38.5 42" fill="none" stroke="#2B2420" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
      </svg>
      kolle<span class="brand-accent">vio</span>
    </a>
    <nav class="main-nav">
      <a href="/#rollen">Rollen</a>
      <a href="/#funktion">So funktioniert's</a>
      <a href="/#preise">Preise</a>
      {% if request.cookies.get('kollevio_session') %}
        <a href="/dashboard" class="nav-cta">Mein Team</a>
      {% else %}
        <a href="/login">Anmelden</a>
        <a href="/register" class="nav-cta">Kostenlos starten</a>
      {% endif %}
    </nav>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <svg class="brand-mark" width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="url(#bm-g)"/>
        <line x1="32" y1="13" x2="32" y2="20" stroke="#FBF8F3" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
        <circle cx="32" cy="11.5" r="3.4" fill="#FBF8F3"/>
        <circle cx="32" cy="37" r="15.5" fill="#FBF8F3"/>
        <circle cx="26.2" cy="34.5" r="2.6" fill="#2B2420"/>
        <circle cx="37.8" cy="34.5" r="2.6" fill="#2B2420"/>
        <path d="M 25.5 42 Q 32 47 38.5 42" fill="none" stroke="#2B2420" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
      </svg>
      kolle<span class="brand-accent">vio</span>
    </div>
    <div class="footer-links">
      <a href="/impressum">Impressum</a>
      <a href="/agb">AGB</a>
      <a href="mailto:hello@kollevio.com">hello@kollevio.com</a>
    </div>
    <div class="footer-copy">© <span id="footer-year"></span> kollevio — Rafael Oliveira Göpfert</div>
  </div>
</footer>
<script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
{% block scripts %}{% endblock %}
</body>
</html>
