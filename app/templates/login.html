{% extends "base.html" %}
{% block title %}Anmelden — kollevio{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Anmelden</h2>
    <div class="form-error" id="form-error"></div>
    <form id="login-form">
      <div class="field"><label>E-Mail oder Benutzername</label><input name="identifier" required></div>
      <div class="field"><label>Passwort</label><input type="password" name="password" required></div>
      <button class="btn btn-primary btn-block" type="submit">Anmelden</button>
    </form>
    <div class="auth-switch">Noch kein Konto? <a href="/register">Jetzt registrieren</a></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('form-error');
  errEl.textContent = '';
  const data = Object.fromEntries(new FormData(e.target));
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
    });
    const body = await res.json();
    if (!res.ok) { errEl.textContent = body.detail || 'Anmeldung fehlgeschlagen.'; return; }
    window.location.href = body.redirect || '/dashboard';
  } catch (err) { errEl.textContent = 'Verbindungsfehler. Bitte erneut versuchen.'; }
});
</script>
{% endblock %}
